name: keepalive
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live site
        env:
          BASHI_URL: ${{ vars.BASHI_URL }}
        run: |
          test -n "$BASHI_URL" || { echo "Set the repo variable BASHI_URL"; exit 1; }
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --max-time 120 "$BASHI_URL/health"
